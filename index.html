<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tyler's Apps</title>
<style>:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#6e6e73}@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989d}}
*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:calc(48px + env(safe-area-inset-top)) 16px 40px}
main{max-width:560px;margin:0 auto}h1{font:700 34px/1.1 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.6px;margin-bottom:20px}
a{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.07);transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
a:active{transform:scale(.97)}a span:first-child{font-size:34px;width:60px;height:60px;border-radius:15px;display:grid;place-items:center;flex:none}
b{display:block}small{color:var(--sub)}</style></head><body><main><h1>Apps</h1>
<a href="trainer/"><span style="background:#007aff22">🚚</span><span><b>Logistics Trainer</b><small>33 freight brokerage questions, modes and review</small></span></a>
<a href="dogs/"><span style="background:#ff950022">🐶</span><span><b>Kennel</b><small>Breed dogs, discover hybrids, unlock breeds</small></span></a>
</main></body></html>
